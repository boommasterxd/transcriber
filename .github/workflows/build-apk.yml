name: Build APK

# Runs manually from the Actions tab for on-demand release APK validation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Restore shared Gradle dependencies
        uses: ./.github/actions/dependency-cache
        with:
          store: gradle

      # Write the release keystore + key.properties from secrets so every build
      # is signed with the same key (updates install over previous versions).
      # Falls back to debug signing when the secrets aren't set.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing secrets set, building with debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          echo "Release signing configured."

      - name: Reuse or install pinned Android NDKs
        uses: ./.github/actions/setup-android-ndk

      - name: Build
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --no-pub --build-number=${{ github.run_number }}

      # Confirm the APK is actually release-signed. Fails the build if signing
      # fell back to the debug key (CN=Android Debug), so a misconfigured secret
      # can never ship an unupgradable APK silently.
      - name: Verify signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is debug-signed, release signing secrets are missing or wrong."
            exit 1
          fi
          echo "APK is release-signed."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcriber-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
