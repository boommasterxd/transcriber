name: Build APK

# Manual-only: run from the Actions tab (or via API). Not triggered by commits,
# so a push never starts a build (and never two at once).
on:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # This app bundles large native libraries (ffmpeg-kit, flutter_gemma's
      # litertlm/qdrant) plus the Android NDK, which overflow the hosted runner.
      # Reclaim space the runner pre-fills with toolchains we don't use.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "After:"; df -h /

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Cache Gradle dependencies + build cache across runs (the biggest repeat
      # cost after the first build).
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Cache the native libraries flutter_gemma downloads at build time.
      - name: Cache flutter_gemma native libs
        uses: actions/cache@v4
        with:
          path: ~/.cache/flutter_gemma
          key: gemma-native-${{ runner.os }}

      # Write the release keystore + key.properties from secrets so every build
      # is signed with the same key (updates install over previous versions).
      # Falls back to debug signing when the secrets aren't set.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets set — building with debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          echo "Release signing configured."

      - name: Build
        run: |
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: transcriber-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
