name: Build APK

# Runs manually from the Actions tab for on-demand APK validation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android Preview APK
    # GitHub keeps the original actor on reruns, so also check who requested the rerun.
    if: >-
      github.repository == 'boommasterxd/transcriber' &&
      github.actor_id == '62777283' &&
      github.triggering_actor == 'boommasterxd'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Restore shared Gradle dependencies
        uses: ./.github/actions/dependency-cache
        with:
          store: gradle

      - name: Reuse or install pinned Android NDKs
        uses: ./.github/actions/setup-android-ndk

      - name: Build isolated preview APK
        env:
          TRANSCRIBER_TEST_APK: 'true'
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --no-pub --build-number="$GITHUB_RUN_NUMBER"

      - name: Verify preview package and signature
        run: |
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          bash tool/package/verify_apk_identity.sh \
            build/app/outputs/flutter-apk/app-release.apk com.transcriber.app.preview
          mv build/app/outputs/flutter-apk/app-release.apk transcriber-preview-android.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcriber-preview-android
          path: transcriber-preview-android.apk
          if-no-files-found: error
          retention-days: 3
