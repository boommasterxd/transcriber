name: Build APK

# Manual-only: run from the Actions tab (or via API). Not triggered by commits,
# so a push never starts a build (and never two at once).
on:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # This app bundles large native libraries (ffmpeg-kit, flutter_gemma's
      # litertlm/qdrant) plus the Android NDK, which overflow the hosted runner.
      # Reclaim space the runner pre-fills with toolchains we don't use.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "After:"; df -h /

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: transcriber-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
