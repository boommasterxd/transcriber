name: Build APK

# Runs manually from the Actions tab, and on pushes to the active dev branch
# so a commit can kick off a build without needing the API.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/amazing-hawking-nc56k5

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # This app bundles large native libraries (ffmpeg-kit, flutter_gemma's
      # litertlm/qdrant) plus the Android NDK, which overflow the hosted runner.
      # Reclaim space the runner pre-fills with toolchains we don't use.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "After:"; df -h /

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      # Cache Gradle dependencies + build cache across runs (the biggest repeat
      # cost after the first build).
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Cache the native libraries flutter_gemma downloads at build time.
      - name: Cache flutter_gemma native libs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/flutter_gemma
          key: gemma-native-${{ runner.os }}

      # Write the release keystore + key.properties from secrets so every build
      # is signed with the same key (updates install over previous versions).
      # Falls back to debug signing when the secrets aren't set.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing secrets set — building with debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          echo "Release signing configured."

      # Gradle's on-demand NDK download on the hosted runner intermittently
      # produces a corrupt archive ("Archive is not a ZIP archive"), failing the
      # build. Install the one pinned NDK up front via sdkmanager, retrying and
      # wiping the partial each time, so the build never has to download it.
      - name: Pre-install NDK (with retry)
        run: |
          # android/app/build.gradle.kts pins ndkVersion (28.2.x), which Flutter's
          # Gradle tooling applies to every plugin module too - except AGP 9 also
          # resolves its own default NDK (28.0.13004108) during project evaluation
          # for reasons unrelated to any specific plugin (checked all four KGP
          # plugins' build.gradle for a hardcoded ndkVersion, found none). Install
          # both up front so neither triggers the on-demand download above.
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager | sort -V | tail -1)
          echo "Using $SDKMGR"
          for NDK_VER in 28.0.13004108 28.2.13676358; do
            for i in 1 2 3 4; do
              rm -rf "$SDK/ndk/$NDK_VER"
              if yes | "$SDKMGR" "ndk;$NDK_VER"; then
                echo "NDK $NDK_VER installed."; break
              fi
              echo "NDK $NDK_VER attempt $i failed; retrying in $((i*5))s"; sleep $((i*5))
            done
            test -d "$SDK/ndk/$NDK_VER"
          done

      - name: Build
        run: |
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }}

      # Confirm the APK is actually release-signed. Fails the build if signing
      # fell back to the debug key (CN=Android Debug), so a misconfigured secret
      # can never ship an unupgradable APK silently.
      - name: Verify signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is debug-signed — release signing secrets are missing or wrong."
            exit 1
          fi
          echo "APK is release-signed."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transcriber-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3