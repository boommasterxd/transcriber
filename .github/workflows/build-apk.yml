name: Build APK

# Manual-only: run from the Actions tab (or via API). Not triggered by commits,
# so a push never starts two runs.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Flutter + Android SDK/NDK and the ffmpeg-kit / flutter_gemma native
      # libraries are large; reclaim space the hosted runner pre-fills with
      # toolchains we don't use.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "After:"; df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Informational only — lint findings shouldn't block the APK build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: transcriber-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
