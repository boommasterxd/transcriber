name: CI

# Required quality gates for pull requests. The signed
# release APK remains in the dedicated build and release workflows.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false
      - name: Classify the complete pull request
        id: scope
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tool/ci/detect-change-scope.cjs >> "$GITHUB_OUTPUT"

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false
      - name: Test CI classification and final gate
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='tool/ci/*.cjs'
          --test-coverage-lines=85 --test-coverage-functions=85 --test-coverage-branches=80
          test/tool/ci/*.test.cjs
      - name: Install workflow linters
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          actionlint_archive="$RUNNER_TEMP/actionlint.tar.gz"
          actionlint_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location "$actionlint_url" --output "$actionlint_archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum --check
          tar -xzf "$actionlint_archive" -C "$RUNNER_TEMP" actionlint

          shellcheck_archive="$RUNNER_TEMP/shellcheck.tar.gz"
          shellcheck_url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl --fail --silent --show-error --location "$shellcheck_url" --output "$shellcheck_archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$shellcheck_archive" | sha256sum --check
          tar -xzf "$shellcheck_archive" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/shellcheck"
      - name: Check workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color=false -shellcheck="$RUNNER_TEMP/shellcheck"
      - name: Check shell scripts
        run: |
          "$RUNNER_TEMP/shellcheck" tool/package/*.sh tool/quality/*.sh

  analyze:
    name: Analyze and test
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test with coverage
        run: flutter test --coverage --branch-coverage
      - name: Enforce coverage thresholds
        run: dart run tool/quality/check_coverage.dart coverage/lcov.info

  metrics:
    name: Size and complexity
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Collect Dart metrics
        run: |
          mkdir -p "$RUNNER_TEMP/code-quality"
          dart run dart_code_linter:metrics analyze lib test tool \
            --reporter=json \
            --json-path="$RUNNER_TEMP/code-quality/metrics.json" \
            --no-fatal-warnings >/dev/null
      - name: Enforce size and complexity thresholds
        run: >-
          dart run tool/quality/check_code_quality.dart
          --metrics "$RUNNER_TEMP/code-quality/metrics.json"

  dead-code:
    name: Dead code
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check unused code
        run: >-
          dart run dart_code_linter:metrics check-unused-code
          lib test tool --analyze-private-members
      - name: Check unused files
        run: dart run dart_code_linter:metrics check-unused-files lib test tool

  kotlin-quality:
    name: Kotlin quality and tests
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check Kotlin quality
        run: bash tool/quality/check_kotlin_quality.sh
      - name: Run native unit tests and compile device tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin

  duplication:
    name: Duplication
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false
      - name: Check Dart duplication
        run: >-
          npx --yes jscpd@5.0.16
          --min-tokens 50
          --threshold 0
          --reporters console
          --format dart
          --ignore "**/*.g.dart"
          lib test tool

  build:
    name: Build bundle
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Flutter asset bundle
        run: flutter build bundle --debug
      - name: Verify bundle
        run: test -d build/flutter_assets

  dependency-audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/dependency-audit.yml

  CI:
    name: CI
    if: always()
    needs: [changes, workflow-lint, analyze, metrics, dead-code, kotlin-quality, duplication, build, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false
      - name: Require every applicable CI job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node tool/ci/require-ci-success.cjs
