name: CI

# Static analysis and tests on every PR and on pushes to the default branch.
# Required status check for the branch ruleset. The heavy APK build stays in
# build-apk.yml (manual / feature branch) to keep PR CI fast.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Flutter
        run: |
          FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            | tar -xJ -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
