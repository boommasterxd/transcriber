name: CI

# Required quality gates for pull requests. The signed
# release APK remains in the dedicated build and release workflows.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      workflow: ${{ steps.scope.outputs.workflow }}
      dart: ${{ steps.scope.outputs.dart }}
      jvm: ${{ steps.scope.outputs.jvm }}
      native: ${{ steps.scope.outputs.native }}
      build: ${{ steps.scope.outputs.build }}
      dependency_audit: ${{ steps.scope.outputs.dependency_audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false
      - name: Classify the complete pull request
        id: scope
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tool/ci/detect-change-scope.cjs >> "$GITHUB_OUTPUT"

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false
      - name: Test CI classification and final gate
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='tool/ci/*.cjs'
          --test-coverage-lines=85 --test-coverage-functions=85 --test-coverage-branches=80
          test/tool/ci/*.test.cjs
      - name: Install workflow linters
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          actionlint_archive="$RUNNER_TEMP/actionlint.tar.gz"
          actionlint_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location "$actionlint_url" --output "$actionlint_archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum --check
          tar -xzf "$actionlint_archive" -C "$RUNNER_TEMP" actionlint

          shellcheck_archive="$RUNNER_TEMP/shellcheck.tar.gz"
          shellcheck_url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl --fail --silent --show-error --location "$shellcheck_url" --output "$shellcheck_archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$shellcheck_archive" | sha256sum --check
          tar -xzf "$shellcheck_archive" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/shellcheck"
      - name: Check workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color=false -shellcheck="$RUNNER_TEMP/shellcheck"
      - name: Check shell scripts
        run: |
          "$RUNNER_TEMP/shellcheck" tool/package/*.sh tool/quality/*.sh

  dart-quality:
    name: Dart quality, tests and bundle
    needs: changes
    if: needs.changes.outputs.dart == 'true' || (needs.changes.outputs.build == 'true' && needs.changes.outputs.native != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        if: ${{ !cancelled() && needs.changes.outputs.dart == 'true' }}
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        if: ${{ !cancelled() && needs.changes.outputs.dart == 'true' }}
        run: flutter analyze --fatal-infos --no-pub
      - name: Select affected tests
        id: tests
        if: ${{ !cancelled() && needs.changes.outputs.dart == 'true' }}
        env:
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          dart run tool/ci/select_tests.dart
          --base "$CHANGE_BASE_SHA" --head "$CHANGE_HEAD_SHA"
          --output .dart_tool/ci/test-plan.json
      - name: Test and enforce coverage thresholds
        if: ${{ !cancelled() && needs.changes.outputs.dart == 'true' && steps.tests.outcome == 'success' }}
        run: dart run tool/ci/run_test_plan.dart .dart_tool/ci/test-plan.json
      - name: Collect Dart metrics
        if: ${{ !cancelled() && needs.changes.outputs.dart == 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/code-quality"
          dart run dart_code_linter:metrics analyze lib test tool \
            --reporter=json \
            --json-path="$RUNNER_TEMP/code-quality/metrics.json" \
            --no-fatal-warnings >/dev/null
      - name: Enforce size and complexity thresholds
        if: ${{ !cancelled() && needs.changes.outputs.dart == 'true' }}
        run: >-
          dart run tool/quality/check_code_quality.dart
          --metrics "$RUNNER_TEMP/code-quality/metrics.json"
      - name: Check unused code
        if: ${{ !cancelled() && needs.changes.outputs.dart == 'true' }}
        run: >-
          dart run dart_code_linter:metrics check-unused-code
          lib test tool --analyze-private-members
      - name: Check unused files
        if: ${{ !cancelled() && needs.changes.outputs.dart == 'true' }}
        run: dart run dart_code_linter:metrics check-unused-files lib test tool
      - name: Set up Node.js
        if: ${{ !cancelled() && needs.changes.outputs.dart == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false
      - name: Check Dart duplication
        if: ${{ !cancelled() && needs.changes.outputs.dart == 'true' }}
        run: >-
          npx --yes jscpd@5.0.16
          --min-tokens 50 --threshold 0 --reporters console
          --format dart --ignore "**/*.g.dart" lib test tool
      - name: Build Flutter asset bundle
        if: ${{ !cancelled() && needs.changes.outputs.build == 'true' && needs.changes.outputs.native != 'true' }}
        run: flutter build bundle --debug --no-pub
      - name: Verify bundle
        if: ${{ !cancelled() && needs.changes.outputs.build == 'true' && needs.changes.outputs.native != 'true' }}
        run: test -d build/flutter_assets

  jvm-quality:
    name: JVM quality and tests
    needs: changes
    if: needs.changes.outputs.jvm == 'true' && needs.changes.outputs.native != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate JVM dependency cache
        run: printf 'GRADLE_USER_HOME=%s/ci-jvm-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache JVM dependencies and wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/ci-jvm-gradle/caches/modules-2
            ${{ runner.temp }}/ci-jvm-gradle/wrapper
          key: ci-jvm-deps-v1-${{ runner.os }}-${{ hashFiles('tool/ci/jvm/**', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ci-jvm-deps-v1-${{ runner.os }}-
      - name: Check Kotlin quality
        run: bash tool/quality/check_kotlin_quality.sh
      - name: Enforce native and shell file length
        if: ${{ !cancelled() }}
        run: node tool/ci/check-native-file-length.cjs
      - name: Run pure JVM unit tests
        if: ${{ !cancelled() }}
        run: android/gradlew -p tool/ci/jvm test verifyNativeCoverage --no-daemon
      - name: Prove JVM tests reject a production defect
        if: ${{ !cancelled() && needs.changes.outputs.workflow == 'true' }}
        run: >-
          node --test test/tool/ci/jvm-test-failure.integration.cjs
          test/tool/ci/native-coverage.integration.cjs

  kotlin-quality:
    name: Android quality and tests
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle dependencies and wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ci-gradle-deps-v2-${{ runner.os }}-${{ hashFiles('.fvmrc', 'pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'tool/ci/jvm/**') }}
          restore-keys: |
            ci-gradle-deps-v2-${{ runner.os }}-
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check Kotlin quality
        run: bash tool/quality/check_kotlin_quality.sh
      - name: Enforce native and shell file length
        if: ${{ !cancelled() }}
        run: node tool/ci/check-native-file-length.cjs
      - name: Run native unit tests and compile device tests
        if: ${{ !cancelled() }}
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:verifyNativeCoverage :app:compileDebugAndroidTestKotlin
      - name: Verify standalone JVM harness
        if: ${{ !cancelled() && needs.changes.outputs.workflow == 'true' }}
        run: android/gradlew -p tool/ci/jvm test verifyNativeCoverage --no-daemon
      - name: Prove JVM tests reject failures and skipped suites
        if: ${{ !cancelled() && needs.changes.outputs.workflow == 'true' }}
        run: >-
          node --test test/tool/ci/jvm-test-failure.integration.cjs
          test/tool/ci/native-coverage.integration.cjs
      - name: Verify Flutter bundle assembled by native tests
        if: ${{ !cancelled() && needs.changes.outputs.build == 'true' }}
        run: |
          for bundle in build/app/intermediates/flutter/debug/flutter_assets \
            android/app/build/intermediates/flutter/debug/flutter_assets; do
            if test -s "$bundle/kernel_blob.bin" && test -s "$bundle/AssetManifest.bin"; then
              printf 'Verified Flutter bundle: %s\n' "$bundle"
              exit 0
            fi
          done
          echo 'No complete native Flutter debug bundle was found.' >&2
          exit 1
      - name: Release build scratch space before saving caches
        run: |
          df -h .
          android/gradlew -p android --stop
          rm -rf build android/app/build .dart_tool/flutter_build android/.gradle
          find "$HOME/.gradle/caches" -mindepth 1 -maxdepth 1 \
            ! -name modules-2 -exec rm -rf -- {} +
          df -h .

  dependency-audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.dependency_audit == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/dependency-audit.yml

  CI:
    name: CI
    if: always()
    needs: [changes, workflow-lint, dart-quality, jvm-quality, kotlin-quality, dependency-audit]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          check-latest: true
          package-manager-cache: false
      - name: Require every applicable CI job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node tool/ci/require-ci-success.cjs
