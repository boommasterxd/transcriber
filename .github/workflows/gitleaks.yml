name: Secret scan

# Scans the current working tree for committed secrets using the free gitleaks
# CLI (the gitleaks-action now requires a paid license; the CLI does not).
# Uses 'dir' mode (not 'git') so it checks the CURRENT state only — old secrets
# already purged from the tree (but still in history) don't make every run red.
# Non-blocking: not a required status check, so findings surface without
# blocking merges. Allowlist known non-secrets in .gitleaks.toml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks dir --no-banner --redact --exit-code 1 --verbose .
