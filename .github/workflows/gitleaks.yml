name: Secret scan

# Scans for accidentally committed secrets using the free gitleaks CLI
# (the gitleaks-action now requires a paid license, the CLI does not).
# Non-blocking: failures show up but are not a required status check yet,
# so legitimate config files can be allowlisted in .gitleaks.toml first.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 --verbose .
