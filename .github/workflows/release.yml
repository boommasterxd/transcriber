# Release build: builds the release-signed Android APK and publishes it as a
# GitHub Release. Release assets do NOT count against the Actions artifact
# storage quota, so this is how versions are kept long-term (build-apk.yml stays
# for throwaway test builds with 3-day retention).
#
# Dispatch from protected main with a release version. The publisher creates
# the tag. Signing and publishing use separate protected environments.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version, e.g. 1.0.0. The workflow creates the tag v<version>
          and publishes a GitHub Release for it.
        type: string
        required: true

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  android:
    name: Build unsigned Android APK
    # GitHub keeps the original actor on reruns, so also check who requested the rerun.
    if: &owner_dispatch >-
      github.repository == 'boommasterxd/transcriber' &&
      github.actor_id == '62777283' &&
      github.triggering_actor == 'boommasterxd'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: bash tool/package/verify_release_source.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$REF_PROTECTED"

      - name: Resolve version
        id: ver
        run: |
          version=$(bash tool/package/version.sh)
          build_number=$(bash tool/package/android_release_version_code.sh "$GITHUB_RUN_NUMBER")
          {
            echo "version=$version"
            echo "build-number=$build_number"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Stamp version into pubspec
        env:
          BUILD_VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build-number }}
        run: bash tool/package/stamp_version.sh "$BUILD_VERSION" "$BUILD_NUMBER"

      - name: Restore shared Gradle dependencies
        uses: ./.github/actions/dependency-cache
        with:
          store: gradle

      - name: Reuse or install pinned Android NDKs
        uses: ./.github/actions/setup-android-ndk

      - name: Build
        env:
          BUILD_VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build-number }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release \
            --no-pub \
            --build-name="$BUILD_VERSION" \
            --build-number="$BUILD_NUMBER"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

  sign:
    name: Sign Android APK
    needs: android
    if: *owner_dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.android.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: unsigned

      - name: Sign and verify APK
        env:
          BUILD_VERSION: ${{ needs.android.outputs.version }}
          RELEASE_SIGNER_SHA256: b7577635cc8d1a994551ab4849dfaf155a0e02ab81caf731adbc51996bced005
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          bash tool/package/sign_release_apk.sh \
            "$BUILD_VERSION" unsigned/app-release.apk signed "$RELEASE_SIGNER_SHA256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-signed
          path: signed/
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: [android, sign]
    if: *owner_dispatch
    concurrency:
      group: release-${{ needs.android.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: write   # lets this job delete the run's own artifacts below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.android.outputs.commit }}
          persist-credentials: false

      - name: Download signed release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-signed
          path: dist

      - name: Verify exact release assets
        env:
          BUILD_VERSION: ${{ needs.android.outputs.version }}
        run: bash tool/package/verify_release_assets.sh "$BUILD_VERSION" dist

      - name: Verify release tag and workflow files
        id: tag
        env:
          BUILD_VERSION: ${{ needs.android.outputs.version }}
          BUILT_COMMIT: ${{ needs.android.outputs.commit }}
        run: |
          tag=$(bash tool/package/verify_release_tag.sh "$BUILD_VERSION" "$BUILT_COMMIT")
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          BUILT_COMMIT: ${{ needs.android.outputs.commit }}
          BUILD_VERSION: ${{ needs.android.outputs.version }}
        run: |
          # With assets, gh creates a draft and publishes only after both uploads.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --target "$BUILT_COMMIT" --generate-notes \
            "dist/transcriber-$BUILD_VERSION-android.apk" dist/SHA256SUMS

      - name: Delete build artifacts (now published on the release)
        # The intermediates only hand the APK between jobs. Drop them
        # instead of waiting out retention-days.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                      -q '.artifacts[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "deleted artifact $id"
          done
