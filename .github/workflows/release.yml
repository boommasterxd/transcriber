# Release build: builds the release-signed Android APK and publishes it as a
# GitHub Release. Release assets do NOT count against the Actions artifact
# storage quota, so this is how versions are kept long-term (build-apk.yml stays
# for throwaway test builds with 3-day retention).
#
# Triggered by pushing a tag like v1.2.3, or manually via workflow_dispatch with
# a required `version` input (the publish job then creates the tag). The publish
# job is gated on the `release` environment.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version, e.g. 1.0.0 (no leading "v"). When set, the run
          creates the tag v<version> and publishes a GitHub Release for it.
        type: string
        required: true

# Lets version.sh pick up the manual dispatch version; empty on tag pushes.
env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ffmpeg-kit + flutter_gemma natives + NDK overflow the runner; reclaim space.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "After:"; df -h /

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve version
        id: ver
        run: echo "version=$(bash tool/package/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Stamp version into pubspec
        run: bash tool/package/stamp_version.sh ${{ steps.ver.outputs.version }} ${{ github.run_number }}

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache flutter_gemma native libs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/flutter_gemma
          key: gemma-native-${{ runner.os }}

      # Release keystore from secrets. Falls back to debug signing (the Verify
      # step below then fails the release, so a debug-signed APK never ships).
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning title=Android signing::ANDROID_KEYSTORE_BASE64 is not set — building DEBUG-signed; the release will fail at the Verify step."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          echo "Release signing configured."

      - name: Pre-install NDK (with retry)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager | sort -V | tail -1)
          echo "Using $SDKMGR"
          for NDK_VER in 27.0.12077973 28.2.13676358; do
            for i in 1 2 3 4; do
              rm -rf "$SDK/ndk/$NDK_VER"
              if yes | "$SDKMGR" "ndk;$NDK_VER"; then echo "NDK $NDK_VER installed."; break; fi
              echo "NDK $NDK_VER attempt $i failed; retrying in $((i*5))s"; sleep $((i*5))
            done
            test -d "$SDK/ndk/$NDK_VER"
          done

      - name: Build
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "transcriber-${{ steps.ver.outputs.version }}-android.apk"

      # Fail the release if signing fell back to the debug key.
      - name: Verify signature
        run: |
          APK="transcriber-${{ steps.ver.outputs.version }}-android.apk"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is debug-signed — configure the Android signing secrets before releasing."
            exit 1
          fi
          echo "APK is release-signed."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: transcriber-*-android.apk
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: [android]
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF#refs/tags/v}"
          fi
          echo "name=v${v#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          find . -type f -name 'transcriber-*' ! -name 'SHA256SUMS' \
            | sed 's|^\./||' | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: |
            dist/transcriber-*
            dist/SHA256SUMS
          fail_on_unmatched_files: false
          generate_release_notes: true
