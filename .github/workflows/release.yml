# Release build: builds the release-signed Android APK and publishes it as a
# GitHub Release. Release assets do NOT count against the Actions artifact
# storage quota, so this is how versions are kept long-term (build-apk.yml stays
# for throwaway test builds with 3-day retention).
#
# Triggered by pushing a tag like v1.2.3, or manually via workflow_dispatch with
# a required `version` input (the publish job then creates the tag). The publish
# job is gated on the `release` environment.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version, e.g. 1.0.0 (no leading "v"). When set, the run
          creates the tag v<version> and publishes a GitHub Release for it.
        type: string
        required: true

# Lets version.sh pick up the manual dispatch version; empty on tag pushes.
env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Resolve version
        id: ver
        run: echo "version=$(bash tool/package/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Stamp version into pubspec
        run: bash tool/package/stamp_version.sh ${{ steps.ver.outputs.version }} ${{ github.run_number }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Release keystore from secrets. Falls back to debug signing (the Verify
      # step below then fails the release, so a debug-signed APK never ships).
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning title=Android signing::ANDROID_KEYSTORE_BASE64 is not set, building DEBUG-signed; the release will fail at the Verify step."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          echo "Release signing configured."

      # android/app/build.gradle.kts pins ndkVersion (28.2.x), which Flutter's
      # Gradle tooling applies to every plugin module too - except AGP 9 also
      # resolves its own default NDK (28.0.13004108) during project evaluation
      # for reasons unrelated to any specific plugin (checked all four KGP
      # plugins' build.gradle for a hardcoded ndkVersion, found none). Install
      # both up front so neither triggers the on-demand download above.
      - name: Pre-install NDK (with retry)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager | sort -V | tail -1)
          echo "Using $SDKMGR"
          for NDK_VER in 28.0.13004108 28.2.13676358; do
            for i in 1 2 3 4; do
              rm -rf "$SDK/ndk/$NDK_VER"
              if yes | "$SDKMGR" "ndk;$NDK_VER"; then echo "NDK $NDK_VER installed."; break; fi
              echo "NDK $NDK_VER attempt $i failed; retrying in $((i*5))s"; sleep $((i*5))
            done
            test -d "$SDK/ndk/$NDK_VER"
          done

      - name: Build
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "transcriber-${{ steps.ver.outputs.version }}-android.apk"

      # Fail the release if signing fell back to the debug key.
      - name: Verify signature
        run: |
          APK="transcriber-${{ steps.ver.outputs.version }}-android.apk"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is debug-signed, configure the Android signing secrets before releasing."
            exit 1
          fi
          echo "APK is release-signed."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: transcriber-*-android.apk
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: [android]
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: write   # lets this job delete the run's own artifacts below
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF#refs/tags/v}"
          fi
          echo "name=v${v#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          find . -type f -name 'transcriber-*' ! -name 'SHA256SUMS' \
            | sed 's|^\./||' | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: |
            dist/transcriber-*
            dist/SHA256SUMS
          fail_on_unmatched_files: false
          generate_release_notes: true

      - name: Delete build artifacts (now published on the release)
        # android only existed to hand the APK to this job; it is on the
        # GitHub Release now, so drop the workflow artifact immediately
        # instead of waiting out retention-days.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                      -q '.artifacts[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "deleted artifact $id"
          done
