name: Update gitleaks version

# Monthly check for a new gitleaks release. gitleaks is a pinned CLI binary
# (not an action or manifest dependency), so Dependabot cannot update it.
# This bumps version + SHA256 in .gitleaks-version and opens a PR.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for new release and open PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release=$(gh api repos/gitleaks/gitleaks/releases/latest | jq -ce -f tool/ci/read_gitleaks_release.jq)
          latest=$(jq -er '.version' <<< "$release")
          checksum=$(jq -er '.sha256' <<< "$release")
          current=$(jq -er '.version' .gitleaks-version)
          echo "Current: $current | Latest: $latest"
          if [ "$latest" = "$current" ]; then echo "Up to date."; exit 0; fi
          branch="chore/gitleaks-${latest}"
          lookup=0
          git ls-remote --exit-code --heads origin "$branch" >/dev/null || lookup=$?
          if [ "$lookup" -eq 0 ]; then echo "Branch exists."; exit 0; fi
          if [ "$lookup" -ne 2 ]; then exit "$lookup"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          jq --arg v "$latest" --arg s "$checksum" '.version=$v | .sha256=$s' .gitleaks-version > .gitleaks-version.tmp && mv .gitleaks-version.tmp .gitleaks-version
          git add .gitleaks-version
          git commit -m "ci: bump gitleaks ${current} -> ${latest}"
          git push -u origin "$branch"
          gh pr create --title "ci: bump gitleaks ${current} -> ${latest}" \
            --body "Updates the pinned gitleaks CLI version and its SHA256 checksum in .gitleaks-version." \
            --label dependencies \
            --base "$(gh api "/repos/${GITHUB_REPOSITORY}" --jq .default_branch)" --head "$branch"
