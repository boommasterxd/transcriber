org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
# AGP 9 built-in Kotlin migration flags (added by the Flutter migrator / template).
# Kept at false so Flutter's temporary backward-compat path keeps the build green
# while the new kotlin.compilerOptions DSL is already in use in app/build.gradle.kts.
# See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.newDsl=false
android.builtInKotlin=false
# Some plugins (e.g. receive_sharing_intent) compile Java at 1.8 while Kotlin
# defaults to 17 under JDK 17, which trips Kotlin's strict JVM-target check.
# Relax it to a warning so the build proceeds (bytecode is compatible at minSdk 26).
kotlin.jvm.target.validation.mode=warning
