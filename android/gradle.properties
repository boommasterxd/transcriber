org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=false
# Flutter 3.47 supports built-in Kotlin independently of the new AGP DSL.
android.builtInKotlin=true
# Flutter and android_file_picker still use legacy DSL/Variant API types.
# Keep this compatibility path until their supported new-DSL migration lands.
android.newDsl=false
