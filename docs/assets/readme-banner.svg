  <title id="title">Transcriber</title>
  <desc id="description">Your voice, organized. A violet waveform flows into a note. Record, import, share, and dictate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17142d"/>
      <stop offset="1" stop-color="#29204c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b6aaff"/>
      <stop offset="1" stop-color="#6c5ce7"/>
    </linearGradient>
  </defs>
