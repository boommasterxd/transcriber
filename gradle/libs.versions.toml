[versions]
agp = "8.11.0"
core = "4.6.2"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
common = "0.10.0"
googleGmsGoogleServices = "4.4.2"
firebaseAi = "16.1.0"
