name: transcriber
description: Transcribe and summarize voice notes with OpenAI or Google Gemini.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Audio capture and playback
  record: ^7.1.0
  just_audio: ^0.10.5

  # Platform integration
  receive_sharing_intent: ^1.8.1
  permission_handler: ^13.0.0
  file_picker: ^12.2.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Persistence
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  # Legacy read-only migration. Remove after the documented migration window.
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # Networking (cloud providers)
  http: ^1.6.0

  # Misc
  uuid: ^4.5.3
  intl: ^0.20.2
  share_plus: ^13.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  analyzer: ^13.3.0
  build_runner: ^2.16.1
  dart_code_linter: ^4.3.0
  drift_dev: ^2.34.6
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/providers/openai.png
    - assets/images/providers/openai_dark.png
    - assets/images/providers/gemini.png
