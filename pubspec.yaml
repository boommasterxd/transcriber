name: transcriber
description: Transcribe and summarize voice notes locally on device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2

  # On-device ML
  whisper_kit: ^0.3.1
  flutter_gemma: ^1.0.1
  flutter_gemma_litertlm: ^1.0.1
  flutter_gemma_mediapipe: ^1.0.1

  # Keeps on-device summarization running when the app is backgrounded
  # (Android foreground service).
  flutter_foreground_task: ^11.0.1

  # Audio capture / playback / conversion
  record: ^7.1.0
  just_audio: ^0.10.5
  ffmpeg_kit_flutter_new: ^4.2.1

  # Platform integration
  receive_sharing_intent: ^1.8.1
  permission_handler: ^13.0.0
  file_picker: ^12.0.0-beta.7
  background_downloader: ^9.5.5
  path_provider: ^2.1.5
  path: ^1.9.1

  # Persistence
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # Networking (cloud providers)
  http: ^1.6.0

  # Misc
  uuid: ^4.5.3
  intl: ^0.20.2
  share_plus: ^13.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  analyzer: ^12.1.0
  dart_code_linter: ^4.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
